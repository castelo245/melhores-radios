<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sem conexão — Melhores Rádios</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: system-ui, -apple-system, sans-serif;
      background: #0F172A;
      color: #F8FAFC;
      text-align: center;
      padding: 24px;
    }
    main { max-width: 380px; }
    h1 { font-size: 1.4rem; margin-bottom: 12px; }
    p { color: #CBD5E1; line-height: 1.5; margin-bottom: 24px; }
    button {
      background: #2563EB;
      color: #FFFFFF;
      border: 0;
      padding: 12px 24px;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <main>
    <h1>Sem conexão com a internet</h1>
    <p>Conecte-se ao Wi-Fi ou aos dados móveis para ouvir e cadastrar emissoras no Melhores Rádios.</p>
    <button onclick="window.location.reload()">Tentar novamente</button>
  </main>
</body>
</html>
